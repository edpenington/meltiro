[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meltiro"
# Single-sourced from `meltiro.__version__`. The version is stamped into every
# session's provenance record, so a second declaration here could drift from
# the one the runtime reports and silently misdate an extraction's audit trail.
dynamic = ["version"]
description = "Agentic LLM-assisted data extraction for systematic reviews: paper bundle + config in, structured evidence-linked extraction out."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ed Penington" }]
keywords = ["systematic-review", "data-extraction", "llm", "evidence-synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # POSIX-only, declared rather than discovered at import. `run_log.py`
    # imports `fcntl` at module scope and takes an exclusive `flock` around
    # the whole read-modify-write of run_log.json, so two sessions finishing
    # at once (a multi-`--paper` batch) cannot clobber each other's append.
    # Guarding the import would trade a loud ImportError on Windows for a
    # silently unlocked append on the one file that records what every run
    # produced — the failure would be a lost or duplicated entry in an audit
    # trail, discovered later or never. No Windows support is claimed
    # anywhere, and CI tests Linux only, so the honest declaration is the
    # narrow one.
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The paper bundle format: the specification of what a run is given, and
    # the code that enforces it. meltiro reads bundles and does not define
    # them, so the definition is imported: `load_bundle` refuses behind
    # `alteksto.bundle.validate_bundle` and enumerates `figures/` through
    # `alteksto.bundle.figure_files`, so what this package accepts, and what
    # it then reads off the directory, are that specification's answers.
    # Anyone building a bundle builds to alteksto, which is also where a
    # bundle is produced from a PDF.
    #
    # The floor is where `figure_files` arrives, and where the page stack
    # moved behind an extra so that this dependency weighs what the contract
    # weighs: `alteksto.bundle` imports the standard library and nothing
    # else. An install below it lacks the enumeration `load_bundle` calls,
    # and drags a PDF library into every environment that only reads bundles.
    "alteksto>=0.2.0",
    # The shared provider layer: adapters, model registry, cost arithmetic —
    # and, since meltiro builds no provider client of its own, the package that
    # carries the provider SDKs. `direktoro.build_adapter` resolves the
    # endpoint, the key variable and the SDK from a model id, and direktoro
    # declares `anthropic` and `openai` at the floors its own call sites need;
    # tests/test_dependency_floors.py checks those floors, and this package's
    # silence on them, on every run.
    #
    # meltiro stays importable WITHOUT it — every name `import meltiro`
    # advertises resolves with direktoro absent, so a consumer that only reads
    # and validates bundles can install --no-deps and add `alteksto` and
    # `pyyaml` (both needed by the import itself) plus `python-dotenv` (needed
    # by the CLI) by hand. --no-deps here means "without the provider layer",
    # NOT "without dependencies": the other three are load-bearing either way.
    # The CLI requires direktoro outright.
    #
    # The floor is a fingerprint floor, not a feature floor, and it is the
    # strictest kind meltiro declares. `call_identity_fields` plus
    # `canonical_json` produce the block that is the FIRST component of every
    # stage fingerprint; `resolved_decoding_params` decides which of those
    # params reach it; `model_supports_images` feeds `structure_hash`. A
    # release that changes the shape of any of those moves every fingerprint
    # this project has published, with no config edit to explain it. 0.3.0 is
    # the version whose shapes the recorded goldens were computed against, so
    # an install below it would recompute published numbers differently — and
    # 0.3.0 is also where a role's decoding block is split and validated by
    # direktoro (`split_decoding_config`), where reasoning effort became
    # caller-specifiable, and where feasibility — documented value bands, and a
    # cap a thinking call cannot answer within — is refused before spend. An
    # older install does not merely fingerprint differently: it raises.
    # Runs record the resolved version too (`direktoro_version` in run.json and
    # in each run-log entry, folded into `engine_fp`), so the declaration here
    # and the artefact agree on which direktoro produced a given run.
    #
    # 0.4.3 raises it, and unlike the fingerprint reasoning above this is a
    # feature floor — and a SEMANTIC one, which is the stricter thing to be.
    # `ProviderAccountError` decides which provider refusals pause a run and
    # which end it (see `Orchestrator._pause_on_provider_account`), so the
    # floor does not merely say the name imports: it says what the name means.
    #
    # 0.4.2 is where the class arrives, and it is excluded deliberately. There
    # every 403 is that class, and a 403 is not one thing — OpenRouter, a
    # transport direktoro registers, documents it as a permission denial OR a
    # guardrail block OR a moderation flag. The last two are refusals about
    # what was ASKED, and pausing on one strands a run waiting for an account
    # nobody needs to touch, resuming into the same block for as long as
    # anyone keeps resuming it. 0.4.3 reads the body's markers and leaves
    # those a plain `ProviderError`; it also admits 402, so a gateway balance
    # running dry pauses as a direct one already did.
    #
    # Declared rather than guarded, because the failure it prevents is silent
    # in both directions: an older install pauses on a blocked prompt, and
    # nothing in a run record would say why the operator was sent to look at
    # a balance.
    "direktoro>=0.4.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/edpenington/meltiro"
Repository = "https://github.com/edpenington/meltiro"
Issues = "https://github.com/edpenington/meltiro/issues"

[project.scripts]
meltiro = "meltiro.cli:main"

[tool.setuptools.dynamic]
version = { attr = "meltiro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The engine prompt sections ship with the package: a prompt composing
# `{include:meltiro:NAME}` resolves it from the installed tree, and the source
# digest folded into `engine_fp` hashes the same files.
meltiro = ["py.typed", "engine_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
